[build]
  command = "mkdir -p netlify-dist && cp index.html script.js style.css grid3d.js favicon.svg netlify-dist/"
  publish = "netlify-dist"

[[redirects]]
  from = "/api/*"
  to = "https://gridtwin.onrender.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/health"
  to = "https://gridtwin.onrender.com/health"
  status = 200
  force = true

[[redirects]]
  from = "/dashboard"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200